<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="320" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="318" height="318" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Icon & Illustration -->
  <g transform="translate(110, 85)" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera / Frame Icon -->
    <rect x="0" y="15" width="100" height="75" rx="12" stroke="#94A3B8" stroke-width="5" fill="#FFFFFF"/>
    <!-- Sun/Moon circle -->
    <circle cx="30" cy="40" r="10" fill="#CBD5E1" stroke="none"/>
    <!-- Mountain / landscape curve -->
    <path d="M12 78 L38 52 L58 70 L72 58 L88 78" stroke="#94A3B8" stroke-width="4.5" fill="none"/>
    <!-- Slash / missing line indicator -->
    <line x1="-15" y1="105" x2="115" y2="-5" stroke="#EF4444" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Clean Typography -->
  <text x="160" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.2">No Image Available</text>
  <text x="160" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Product preview not uploaded</text>
</svg>
