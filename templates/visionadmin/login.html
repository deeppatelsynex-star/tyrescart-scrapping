<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionAdmin - Sign In</title>
  <link rel="icon" type="image/webp" href="/static/assets/images/favicon-color.webp" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                green: '#58B31B',
                bright: '#68C927',
                deep: '#35760F',
                tint: '#EAF7E2',
                ink: '#0E1108'
              }
            }
          }
        }
      };
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#0E1108] text-white flex items-center justify-center p-4 sm:p-6 relative overflow-hidden selection:bg-[#58B31B] selection:text-white">

  <!-- Ambient Light Orbs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#58B31B]/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-[#35760F]/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Background Grid Texture -->
  <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#58B31B_1px,transparent_1px)] [background-size:24px_24px]"></div>

  <div class="relative w-full max-w-md">
    
    <!-- Header Brand Logo -->
    <div class="text-center mb-8 space-y-3">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-3xl bg-[#58B31B] text-white shadow-xl shadow-[#58B31B]/25 p-3 transform hover:scale-105 transition-all duration-300">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
          <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
          <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
          <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/>
          <line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>
        </svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white flex items-center justify-center gap-2">
          Vision<span class="text-[#58B31B]">Admin</span>
          <span class="px-2 py-0.5 text-[10px] font-black uppercase tracking-wider rounded-md bg-[#EAF7E2]/15 text-[#68C927] border border-[#58B31B]/30">CMS</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 font-medium mt-1">Sign in with your administrator credentials</p>
      </div>
    </div>

    <!-- Glassmorphism Login Card -->
    <div class="bg-white/95 backdrop-blur-2xl rounded-3xl p-6 sm:p-8 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] border border-white/20 text-[#0E1108]">
      
      <!-- Error Notification Banner -->
      <div id="login-error-alert" class="hidden mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold flex items-center gap-2.5">
        <svg class="w-4 h-4 shrink-0 text-rose-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-error-text">Invalid email or password.</span>
      </div>

      <!-- Success Notification Banner -->
      <div id="login-success-alert" class="hidden mb-5 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-[#35760F] text-xs font-bold flex items-center gap-2.5">
        <svg class="w-4 h-4 shrink-0 text-[#58B31B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Authentication successful! Redirecting...</span>
      </div>

      <form id="visionadmin-login-form" class="space-y-4">
        <!-- Email Input -->
        <div class="space-y-1.5">
          <label for="email" class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              autocomplete="email" 
              placeholder="admin@tyresvision.com" 
              class="w-full pl-10 pr-4 py-3 rounded-2xl border border-[#E8EDE4] text-xs sm:text-sm font-semibold bg-[#F8FAF7] text-[#0E1108] placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#58B31B]/20 focus:border-[#58B31B] transition"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="block text-xs font-extrabold uppercase tracking-wider text-slate-700">Password</label>
            <a href="/tcsadmin/forgot-password" class="text-[11px] font-bold text-[#35760F] hover:text-[#58B31B] transition">Forgot?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              autocomplete="current-password" 
              placeholder="••••••••••••" 
              class="w-full pl-10 pr-10 py-3 rounded-2xl border border-[#E8EDE4] text-xs sm:text-sm font-semibold bg-[#F8FAF7] text-[#0E1108] placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#58B31B]/20 focus:border-[#58B31B] transition"
            />
            <!-- Show/Hide Password Toggle -->
            <button 
              type="button" 
              id="btn-toggle-pwd" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 transition cursor-pointer"
              title="Show/Hide password"
            >
              <svg id="icon-eye" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="icon-eye-off" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded-md text-[#58B31B] focus:ring-[#58B31B]/20 border-slate-300 transition" />
            <span class="text-xs font-bold text-slate-600">Keep me signed in</span>
          </label>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="btn-login-submit"
            class="w-full py-3.5 px-4 rounded-2xl bg-[#00A650] hover:bg-[#58B31B] text-white text-sm font-extrabold tracking-wide shadow-lg shadow-[#00A650]/20 hover:shadow-xl hover:shadow-[#58B31B]/30 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer"
          >
            <span id="btn-login-text">Sign In to VisionAdmin</span>
            <svg id="btn-login-spinner" class="w-4 h-4 animate-spin hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
          </button>
        </div>
      </form>

      <!-- Scraper Admin Link -->
      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-500 font-medium">
          Looking for Data Operations? 
          <a href="/tcsadmin/login" class="font-extrabold text-[#35760F] hover:text-[#58B31B] transition">Scraper Admin &rarr;</a>
        </p>
      </div>
    </div>

    <!-- Security Note -->
    <div class="text-center mt-6">
      <p class="text-[11px] text-slate-500 font-bold flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-[#58B31B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Encrypted TLS &bull; Role-Based Access Control
      </p>
    </div>
  </div>

  <script>
    // Password toggle
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('btn-toggle-pwd');
    const eyeIcon = document.getElementById('icon-eye');
    const eyeOffIcon = document.getElementById('icon-eye-off');

    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        pwdInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    });

    // Form Submission
    const form = document.getElementById('visionadmin-login-form');
    const submitBtn = document.getElementById('btn-login-submit');
    const btnText = document.getElementById('btn-login-text');
    const btnSpinner = document.getElementById('btn-login-spinner');
    const errAlert = document.getElementById('login-error-alert');
    const errText = document.getElementById('login-error-text');
    const successAlert = document.getElementById('login-success-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errAlert.classList.add('hidden');
      successAlert.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) return;

      submitBtn.disabled = true;
      btnText.textContent = 'Verifying credentials...';
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/visionadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          errText.textContent = data.error || 'Authentication failed. Please try again.';
          errAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In to VisionAdmin';
          btnSpinner.classList.add('hidden');
          return;
        }

        successAlert.classList.remove('hidden');
        btnText.textContent = 'Signed in!';
        
        // Read URL query parameter for ?next=
        const urlParams = new URLSearchParams(window.location.search);
        const nextUrl = urlParams.get('next') || data.redirect || '/visionadmin/pages';
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 500);

      } catch (err) {
        errText.textContent = 'Network or server error. Please try again.';
        errAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to VisionAdmin';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
