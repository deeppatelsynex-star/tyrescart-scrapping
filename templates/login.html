<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/x-icon" />
  <title>Login - TyresCart</title>
  <link rel="stylesheet" href="/static/internal.css" />
</head>
<body class="font-quicksand min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/assets/images/favicon-color.webp" alt="TyresCart" class="w-12 h-12 rounded-xl shadow-sm" />
      <h1 class="mt-3 text-xl font-bold text-slate-900 tracking-tight">TyresCart</h1>
      <p class="text-sm text-slate-500">Scraping Dashboard</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <h2 class="text-lg font-semibold text-slate-900 mb-1">Sign in</h2>
      <p class="text-sm text-slate-500 mb-6">Enter your credentials to access your account.</p>

      <div id="form-error" class="hidden mb-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3"></div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            placeholder="you@example.com" />
          <p class="field-error hidden mt-1.5 text-xs text-rose-600"></p>
        </div>

        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" autocomplete="current-password" required
              class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 pr-11 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              placeholder="••••••••" />
            <button type="button" id="toggle-password" tabindex="-1"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 cursor-pointer">
              <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg id="eye-closed" class="hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <p class="field-error hidden mt-1.5 text-xs text-rose-600"></p>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" id="remember" name="remember" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
            Remember me
          </label>
          <a href="/forgot-password" class="text-sm font-medium text-emerald-600 hover:text-emerald-700">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="submit-label">Sign in</span>
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">© TyresCart. All rights reserved.</p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const spinner = document.getElementById('spinner');
    const formError = document.getElementById('form-error');

    togglePasswordBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      eyeOpen.classList.toggle('hidden', !showing);
      eyeClosed.classList.toggle('hidden', showing);
    });

    function clearErrors() {
      formError.classList.add('hidden');
      formError.textContent = '';
      document.querySelectorAll('.field-error').forEach((el) => {
        el.classList.add('hidden');
        el.textContent = '';
      });
    }

    function showFieldError(input, message) {
      const wrapper = input.closest('div.mb-4');
      const el = wrapper ? wrapper.querySelector('.field-error') : null;
      if (el) {
        el.textContent = message;
        el.classList.remove('hidden');
      }
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.classList.toggle('hidden', !isLoading);
      submitLabel.textContent = isLoading ? 'Signing in…' : 'Sign in';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearErrors();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      let hasError = false;

      if (!email) {
        showFieldError(emailInput, 'Email is required.');
        hasError = true;
      }
      if (!password) {
        showFieldError(passwordInput, 'Password is required.');
        hasError = true;
      }
      if (hasError) return;

      setLoading(true);
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            remember: document.getElementById('remember').checked,
          }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          formError.textContent = data.error || 'Unable to sign in. Please try again.';
          formError.classList.remove('hidden');
          setLoading(false);
          return;
        }

        window.location.href = data.redirect || '/';
      } catch (err) {
        formError.textContent = 'Network error. Please try again.';
        formError.classList.remove('hidden');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
