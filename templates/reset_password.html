<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/x-icon" />
  <title>Reset Password - TyresCart</title>
  <style>
    body { font-family: 'Quicksand', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/assets/images/favicon-color.webp" alt="TyresCart" class="w-12 h-12 rounded-xl shadow-sm" />
      <h1 class="mt-3 text-xl font-bold text-slate-900 tracking-tight">TyresCart</h1>
      <p class="text-sm text-slate-500">Scraping Dashboard</p>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <div id="missing-token-state" class="hidden">
        <h2 class="text-lg font-semibold text-slate-900 mb-1">Invalid reset link</h2>
        <p class="text-sm text-slate-500 mb-6">This link is missing its reset token. Request a new one below.</p>
        <a href="/forgot-password"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700">
          Request a new link
        </a>
      </div>

      <form id="reset-form" novalidate>
        <h2 class="text-lg font-semibold text-slate-900 mb-1">Set a new password</h2>
        <p class="text-sm text-slate-500 mb-6">Choose a new password for your account.</p>

        <div id="form-error" class="hidden mb-4 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3"></div>
        <div id="form-success" class="hidden mb-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3"></div>

        <div class="mb-4">
          <label for="new-password" class="block text-sm font-medium text-slate-700 mb-1.5">New password</label>
          <input type="password" id="new-password" name="new_password" autocomplete="new-password" required
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            placeholder="At least 8 characters" />
        </div>

        <div class="mb-6">
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1.5">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required
            class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
            placeholder="••••••••" />
        </div>

        <button type="submit" id="submit-btn"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span id="submit-label">Reset password</span>
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        <a href="/login" class="font-medium text-emerald-600 hover:text-emerald-700">Back to sign in</a>
      </p>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">© TyresCart. All rights reserved.</p>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const spinner = document.getElementById('spinner');
    const formError = document.getElementById('form-error');
    const formSuccess = document.getElementById('form-success');

    if (!token) {
      form.classList.add('hidden');
      document.getElementById('missing-token-state').classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.classList.toggle('hidden', !isLoading);
      submitLabel.textContent = isLoading ? 'Resetting…' : 'Reset password';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.classList.add('hidden');
      formSuccess.classList.add('hidden');

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!newPassword || !confirmPassword) {
        formError.textContent = 'Both fields are required.';
        formError.classList.remove('hidden');
        return;
      }
      if (newPassword !== confirmPassword) {
        formError.textContent = 'Passwords do not match.';
        formError.classList.remove('hidden');
        return;
      }
      if (newPassword.length < 8) {
        formError.textContent = 'Password must be at least 8 characters.';
        formError.classList.remove('hidden');
        return;
      }

      setLoading(true);
      try {
        const response = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword }),
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          formError.textContent = data.error || 'Unable to reset password. Please try again.';
          formError.classList.remove('hidden');
          setLoading(false);
          return;
        }

        formSuccess.textContent = data.message || 'Your password has been reset.';
        formSuccess.classList.remove('hidden');
        form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } catch (err) {
        formError.textContent = 'Network error. Please try again.';
        formError.classList.remove('hidden');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
