<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - TyresVision CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/x-icon" />
  <style>body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">
  <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 sm:p-10 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-slate-950 text-emerald-400 font-black text-lg flex items-center justify-center mx-auto shadow-sm">
        TV
      </div>
      <h1 class="text-2xl font-black text-slate-950 tracking-tight">Tyres<span class="text-emerald-600">Vision</span> CMS</h1>
      <p class="text-xs text-slate-500">Storefront Content Management System</p>
    </div>

    <div id="login-error-box" class="hidden p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700 text-center"></div>

    <form id="cms-login-form" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="deeppatel.synex@gmail.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
          <input type="checkbox" id="remember" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
          <span>Remember me</span>
        </label>
        <a href="/tcsadmin/forgot-password" class="font-bold text-emerald-600 hover:text-emerald-700">Forgot password?</a>
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-slate-950 hover:bg-slate-800 active:bg-black text-white text-sm font-bold shadow-md transition cursor-pointer flex items-center justify-center gap-2">
        <span id="submit-text">Sign In to CMS</span>
      </button>
    </form>

    <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <a href="/" target="_blank" class="hover:underline">View Storefront</a>
      <a href="/tcsadmin/login" class="hover:underline text-emerald-600 font-bold">Scraper Portal</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('cms-login-form');
    const errorBox = document.getElementById('login-error-box');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        errorBox.textContent = 'Please enter both email and password.';
        errorBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitText.textContent = 'Signing in…';

      try {
        const res = await fetch('/tcsadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          errorBox.textContent = data.error || 'Invalid credentials. Please try again.';
          errorBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitText.textContent = 'Sign In to CMS';
          return;
        }

        window.location.href = '/visonadmin/dashboard';
      } catch (err) {
        errorBox.textContent = 'Network error. Please try again.';
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitText.textContent = 'Sign In to CMS';
      }
    });
  </script>
</body>
</html>
