<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - TyresVision CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="shortcut icon" href="/static/assets/images/favicon-color.webp" type="image/x-icon" />
  <style>body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-slate-950 text-emerald-400 font-black text-lg flex items-center justify-center mx-auto shadow-sm">
        TV
      </div>
      <h1 class="text-2xl font-black text-slate-950 tracking-tight">Tyres<span class="text-emerald-600">Vision</span> CMS</h1>
      <p class="text-xs text-slate-500">Storefront Content Management System</p>
    </div>

    <form action="/tcsadmin/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <input type="email" name="email" required placeholder="admin@tyresvision.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-slate-950 hover:bg-slate-800 active:bg-black text-white text-sm font-bold shadow-md transition cursor-pointer">
        Sign In to CMS
      </button>
    </form>

    <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <a href="/" target="_blank" class="hover:underline">View Storefront</a>
      <a href="/tcsadmin/login" class="hover:underline text-emerald-600 font-bold">Scraper Login</a>
    </div>
  </div>
</body>
</html>
